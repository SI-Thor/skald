[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skald-benchmark"
version = "0.1.0"
description = "Skald on-device TTS engine benchmark harness (ADR-0005 / ADR-0010)"
requires-python = ">=3.10"

[project.optional-dependencies]
# Only needed to target a live Riva server; everything else is stdlib-only.
riva = ["nvidia-riva-client>=2.0"]

[project.scripts]
skald-benchmark = "benchmark.__main__:main"

[tool.setuptools]
packages = ["benchmark"]
