# skald/last-mile PTP config — Thor MGBE0 <-> ProArt Ethernet, hardware timestamps.
# Requires a cable (mgbe0_0 currently has no carrier). Verified capability:
#   ethtool -T mgbe0_0 → hardware-transmit/receive, hardware-raw-clock, PHC 1.
# Run on Thor:   sudo ptp4l -f ptp4l-mgbe0.conf
# Run on ProArt: same config (boundary_clock_delay net_sync managed) — or
#   slave-only: add `clientOnly 1`. Then share PHC to system clock:
#   sudo phc2sys -s mgbe0_0 -c CLOCK_REALTIME -w
[global]
twoStepFlag 1
domainNumber 0
logSyncInterval -3          # 8 sync messages/sec
logging_level 6
use_syslog 1

[mgbe0_0]
network_transport L2        # L2 ethertype — no IP config needed on the link
delay_mechanism P2P
